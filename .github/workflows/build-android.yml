
name: Build AETHER POCKET APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout AETHER POCKET
        uses: actions/checkout@v4

      - name: Checkout Play! emulator source
        uses: actions/checkout@v4
        with:
          repository: jpd002/Play-
          ref: 1f27232772e484bfb79364b751b84f41f4c87481
          path: upstream
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager --sdk_root="$ANDROID_HOME" --licenses < /dev/null || true
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.1"

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > upstream/build_android/local.properties

      - name: Apply AETHER POCKET branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("upstream")

          p = root / "build_android/src/main/res/values/donottranslate.xml"
          s = p.read_text()
          old = '<string name="app_name">Play!</string>'
          new = '<string name="app_name">AETHER POCKET</string>'
          if old not in s:
              raise SystemExit("App name not found; stop to avoid incorrect build")
          p.write_text(s.replace(old, new, 1))

          p = root / "Source/ui_android/java/com/virtualapplications/play/Constants.java"
          s = p.read_text().replace(
              'public static String TAG = "Play!";',
              'public static String TAG = "AETHER POCKET";'
          )
          p.write_text(s)

          p = root / "build_android/src/main/res/values/styles.xml"
          if p.exists():
              s = p.read_text().replace("#2196f3", "#00D9FF")
              s = s.replace("#1976d2", "#075985")
              p.write_text(s)

          print("Branding applied.")
          PY

      - name: Build debug APK
        working-directory: upstream/build_android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          find upstream/build_android/build/outputs/apk/debug -name '*.apk' -type f
          test -n "$(find upstream/build_android/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-POCKET-debug-APK
          path: upstream/build_android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
