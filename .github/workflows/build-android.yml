
name: Build AETHER POCKET APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout AETHER POCKET
        uses: actions/checkout@v4

      - name: Checkout Play! emulator
        uses: actions/checkout@v4
        with:
          repository: jpd002/Play-
          ref: 1f27232772e484bfb79364b751b84f41f4c87481
          path: upstream
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/build_android/*.gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;29.0.14206865
            cmake;3.31.1

      - name: Configure SDK path
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > upstream/build_android/local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

      - name: Apply AETHER POCKET branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("upstream")

          app_name = root / "build_android/src/main/res/values/donottranslate.xml"
          text = app_name.read_text()
          old = '<string name="app_name">Play!</string>'
          new = '<string name="app_name">AETHER POCKET</string>'
          if old not in text:
              raise SystemExit("App name resource was not found")
          app_name.write_text(text.replace(old, new, 1))

          strings = root / "build_android/src/main/res/values/strings.xml"
          text = strings.read_text()
          text = text.replace(
              "Play! PlayStation 2 Emulator",
              "AETHER POCKET - PS2 Emulator"
          )
          strings.write_text(text)

          styles = root / "build_android/src/main/res/values/styles.xml"
          text = styles.read_text()
          text = text.replace("#2196f3", "#00D9FF")
          text = text.replace("#1976d2", "#075985")
          styles.write_text(text)

          constants = root / "Source/ui_android/java/com/virtualapplications/play/Constants.java"
          text = constants.read_text()
          text = text.replace(
              'public static String TAG = "Play!";',
              'public static String TAG = "AETHER POCKET";'
          )
          constants.write_text(text)

          print("AETHER POCKET branding applied.")
          PY

      - name: Verify source and SDK
        shell: bash
        run: |
          test -f upstream/CMakeLists.txt
          test -f upstream/build_android/gradlew
          test -f upstream/GameConfig.xml
          test -f upstream/License.txt
          java -version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed

      - name: Build debug APK
        working-directory: upstream/build_android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          find upstream/build_android/build/outputs/apk/debug -type f -name '*.apk' -print
          test -n "$(find upstream/build_android/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-POCKET-debug-APK
          path: upstream/build_android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
